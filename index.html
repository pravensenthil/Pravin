<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Drainage Robotic System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🤖 SMART DRAINAGE ROBOTIC SYSTEM</h1>
  <p>AI Powered Waste Management</p>

  <button id="connectBtn">🔌 CONNECT ARDUINO</button>
  <button id="testDemoBtn">⚡ TEST DEMO NOW</button>

  <!-- Air Quality Status Box -->
  <div class="status-box">
    <h3>Air Quality Status</h3>
    <div id="airStatus" class="status-text" style="color: #4cd137;">Normal (OK)</div>
    <div class="animated-icon">🌀</div>
    <p>(Toxic Gas -> Exhaust Fan ON)</p>
  </div>

  <!-- Drainage Blockage Status Box -->
  <div class="status-box">
    <h3>Drainage Blockage Status</h3>
    <div id="drainageStatus" class="status-text" style="color: #4cd137;">Clean</div>
    <div class="animated-icon">🏗️</div>
    <p>(Trash -> Robotic Arm Scoops & Cleans)</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
